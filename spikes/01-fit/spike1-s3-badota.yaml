# Spike 1, BAD-OTA variant: identical build that aborts in setup(). Flashed over OTA
# to see whether the bootloader rolls back to the good image. See README.md.
# Throwaway. Nothing here is product code. See spikes/01-fit/README.md and issue #4.
#
# Realistic product-shaped component set so the size numbers mean something:
# Wi-Fi + captive portal + Improv + native API + OTA + web server + logger + BLE.
# Wi-Fi credentials come from the gitignored secrets.yaml (bench network).

esphome:
  name: amble-spike1
  friendly_name: amble spike 1
  # Same device name as the good image (it is an OTA update of that device), so it
  # needs its own build directory or the two builds overwrite each other's binaries.
  build_path: .esphome/build/amble-spike1-badota

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    # OTA rollback (CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE) is on by default in
    # ESPHome's esp-idf path when safe_mode is present. We keep the default so the
    # spike measures the product-shaped layout.

psram:
  mode: octal
  speed: 80MHz

external_components:
  - source:
      type: local
      path: components

logger:
  level: INFO

api:

ota:
  - platform: esphome

safe_mode:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "amble-spike1"

captive_portal:

web_server:
  port: 80

improv_serial:

esp32_ble:
  enable_on_boot: true

# The spike component: pulls in the mesh sdkconfig, the internal-header include
# paths, and references the mesh API + key-injection symbols so the linker keeps
# the whole stack. It never transmits.
amble_spike:
  crash_on_boot: true

# Spike 1: does the amaran mesh stack fit and build under ESPHome esp-idf on the S3?
# Throwaway. Nothing here is product code. See spikes/01-fit/README.md and issue #4.
#
# Realistic product-shaped component set so the size numbers mean something:
# Wi-Fi + captive portal + Improv + native API + OTA + web server + logger + BLE.
# Wi-Fi credentials come from the gitignored secrets.yaml (bench network).

esphome:
  name: amble-spike1
  friendly_name: amble spike 1

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    # OTA rollback (CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE) is on by default in
    # ESPHome's esp-idf path when safe_mode is present. We keep the default so the
    # spike measures the product-shaped layout.

psram:
  mode: octal
  speed: 80MHz

external_components:
  - source:
      type: local
      path: components

logger:
  level: INFO

api:

ota:
  - platform: esphome

safe_mode:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "amble-spike1"

captive_portal:

web_server:
  port: 80

improv_serial:

esp32_ble:
  enable_on_boot: true

# The board's on-board addressable RGB LED (WS2812 on GPIO48 on the HiLetgo
# N16R8; GPIO38 on some DevKitC-1 revisions). The factory firmware left it lit
# and it holds its colour until something drives the data line. Forced off.
light:
  - platform: esp32_rmt_led_strip
    id: board_rgb
    name: "Board RGB LED"
    pin: GPIO48
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    restore_mode: ALWAYS_OFF
    internal: true

# The spike component: pulls in the mesh sdkconfig, the internal-header include
# paths, and references the mesh API + key-injection symbols so the linker keeps
# the whole stack. It never transmits.
amble_spike:

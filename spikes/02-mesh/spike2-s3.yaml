# Spike 2: mesh hello and coexistence, on the dev board against the spare P60c.
# Throwaway. See spikes/02-mesh/README.md.
#
# transmit: false  = receive-only (phase A: prove the userland snoop on live traffic)
# transmit: true   = unicast commands to the one bench fixture (phase B)

substitutions:
  transmit: "false"

esphome:
  name: amble-spike2
  friendly_name: amble spike 2

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended

psram:
  mode: octal
  speed: 80MHz

external_components:
  - source:
      type: local
      path: components

logger:
  level: INFO

api:

ota:
  - platform: esphome

safe_mode:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "amble-spike2"

captive_portal:

web_server:
  port: 80

esp32_ble:
  enable_on_boot: true

light:
  - platform: esp32_rmt_led_strip
    id: board_rgb
    name: "Board RGB LED"
    pin: GPIO48
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    restore_mode: ALWAYS_OFF
    internal: true

amble_spike2:
  id: spike
  own_address: 0x00F1
  transmit: ${transmit}

# Test harness entities, driven over the web server's REST API from the Mac.
switch:
  - platform: template
    id: p60c_power
    name: "P60c power"
    optimistic: true
    turn_on_action:
      - lambda: id(spike).send_onoff(true);
    turn_off_action:
      - lambda: id(spike).send_onoff(false);

number:
  - platform: template
    id: p60c_brightness
    name: "P60c brightness"
    min_value: 0
    max_value: 100
    step: 1
    optimistic: true
    set_action:
      - lambda: id(spike).send_brightness((uint16_t) (x * 10));
  - platform: template
    id: p60c_cct
    name: "P60c CCT"
    min_value: 2500
    max_value: 7500
    step: 100
    optimistic: true
    set_action:
      - lambda: id(spike).send_cct((uint16_t) x, (uint16_t) (id(p60c_brightness).state * 10), 0);
  - platform: template
    id: p60c_hue
    name: "P60c hue"
    min_value: 0
    max_value: 360
    step: 1
    optimistic: true
    set_action:
      - lambda: id(spike).send_hsi((uint16_t) x, 100, (uint16_t) (id(p60c_brightness).state * 10));

button:
  - platform: template
    id: p60c_status
    name: "P60c status request"
    on_press:
      - lambda: id(spike).send_status_request();
  - platform: restart
    id: reboot
    name: "Reboot"

sensor:
  - platform: template
    id: snooped_total
    name: "Snooped status replies"
    update_interval: 5s
    accuracy_decimals: 0
    lambda: return id(spike).snooped_total();
  - platform: template
    id: snooped_target
    name: "Snooped P60c replies"
    update_interval: 5s
    accuracy_decimals: 0
    lambda: return id(spike).snooped_target();
  - platform: template
    id: sent_total
    name: "Commands sent"
    update_interval: 5s
    accuracy_decimals: 0
    lambda: return id(spike).sent_total();
  - platform: template
    id: mesh_seq
    name: "Mesh sequence number"
    update_interval: 5s
    accuracy_decimals: 0
    lambda: return id(spike).mesh_seq();
  - platform: template
    id: mesh_iv
    name: "Mesh IV index"
    update_interval: 5s
    accuracy_decimals: 0
    lambda: return id(spike).mesh_iv_index();

text_sensor:
  - platform: template
    id: last_status
    name: "Last P60c status"
    update_interval: 2s
    lambda: return id(spike).last_status_text();
  - platform: template
    id: boot_note
    name: "Mesh boot note"
    update_interval: 10s
    lambda: return id(spike).boot_note();
